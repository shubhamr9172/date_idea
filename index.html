<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for you 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;700&display=swap">
<style>
:root{--bg:#fbf1ea;--bg2:#f3d9d0;--tx:#3a0f2a;--soft:#7b4a62;--gold:#a9772a;--glass:#ffffffc4;--line:#a9772a66;--o1:#f2a7bd;--o2:#f6d19a;--o3:#c9a6e6;--glowc:#c9954a30;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12060f;--bg2:#2a0b22;--tx:#f8ebe0;--soft:#d9b9c3;--gold:#e3c07b;--glass:#2a122bb8;--line:#e3c07b55;--o1:#8e1a4d;--o2:#a8641f;--o3:#4b1f78;--glowc:#e3c07b2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12060f;--bg2:#2a0b22;--tx:#f8ebe0;--soft:#d9b9c3;--gold:#e3c07b;--glass:#2a122bb8;--line:#e3c07b55;--o1:#8e1a4d;--o2:#a8641f;--o3:#4b1f78;--glowc:#e3c07b2e;color-scheme:dark}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--tx);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,var(--bg2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:36;opacity:.07;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.aurora i{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.4;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--o1);left:-20vmax;top:-20vmax}
.aurora i:nth-child(2){background:var(--o2);right:-25vmax;bottom:-25vmax;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--o3);left:30vw;top:30vh;opacity:.25;animation-delay:-15s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.glow{position:fixed;left:0;top:0;width:480px;height:480px;margin:-240px 0 0 -240px;border-radius:50%;background:radial-gradient(circle,var(--glowc),transparent 65%);pointer-events:none;z-index:1;opacity:0;transition:opacity .4s,transform .18s ease-out}
main{position:relative;z-index:2}
.screen{min-height:100%;display:grid;place-content:center;justify-items:center;text-align:center;padding:32px 20px;gap:16px;animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.screen[hidden],.overlay[hidden]{display:none}
.screen.leave{animation:leave .45s forwards}
@keyframes in{from{opacity:0;transform:translateY(24px);filter:blur(8px)}}
@keyframes leave{to{opacity:0;transform:scale(.96);filter:blur(8px)}}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(40px,10vw,76px);line-height:1.02;max-width:11em}
h2{font-size:clamp(32px,7vw,48px);line-height:1.1}
p{margin:0;color:var(--soft);font-size:17px;line-height:1.7;max-width:28em;text-wrap:balance}
.kicker{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:22px;color:var(--gold);animation:in 1.2s .1s both}
.w{display:inline-block;margin-right:.26em;animation:wordIn .8s calc(var(--b,.4s) + var(--i)*var(--st,.04s)) both cubic-bezier(.2,.7,.2,1)}
@keyframes wordIn{from{opacity:0;transform:translateY(.55em);filter:blur(10px)}}
.btn{font:700 18px Manrope,system-ui,sans-serif;border:0;border-radius:999px;padding:16px 42px;cursor:pointer;touch-action:manipulation;position:relative}
.btn:focus-visible,.gift:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.yes{overflow:hidden;color:#2a0b22;background:linear-gradient(135deg,#f6e3c5,#d9a950 55%,#b9782a);box-shadow:0 10px 30px #b9782a55;animation:pulse 2.6s infinite;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.yes::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fffb 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.6s 1.5s infinite}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes pulse{0%{box-shadow:0 10px 30px #b9782a55,0 0 0 0 #d9a95066}70%,100%{box-shadow:0 10px 30px #b9782a55,0 0 0 20px #d9a95000}}
.no{color:var(--soft);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);transition:left .5s cubic-bezier(.34,1.56,.64,1),top .5s cubic-bezier(.34,1.56,.64,1),transform .3s,rotate .5s}
.ghost{background:transparent;color:var(--soft);border:1px solid var(--line);padding:14px 26px;font-size:16px}
.row{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:26px;min-height:80px;animation:in 1s 1.6s both}
#hint{min-height:28px;color:var(--gold);font-weight:700}
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 24px;width:min(92vw,460px);margin-top:30px}
@media(min-width:700px){.gifts{grid-template-columns:repeat(4,1fr);width:min(92vw,820px)}}
.cell{perspective:600px;animation:enter .9s cubic-bezier(.2,.8,.2,1) var(--d) backwards,float 6s ease-in-out calc(var(--d) + .9s) infinite}
@keyframes enter{from{opacity:0;transform:translateY(70px) rotate(var(--r)) scale(.7)}}
@keyframes float{50%{transform:translateY(-10px)}}
.gift{position:relative;display:block;width:100%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s}
.base,.lid{position:absolute;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:inset 0 0 0 1px #ffffff26}
.base{left:5%;right:5%;top:30%;bottom:0;border-radius:6px 6px 14px 14px;box-shadow:0 20px 30px #0006,inset 0 0 0 1px #ffffff26;transition:box-shadow .3s}
.lid{left:0;right:0;top:12%;height:22%;border-radius:8px;filter:brightness(1.15);transform-origin:left bottom;transition:transform .45s cubic-bezier(.3,1.7,.5,1);z-index:1}
.base::before,.lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18%;transform:translateX(-50%);background:linear-gradient(90deg,#c9954a,#f6e3c5,#c9954a)}
.bow{position:absolute;top:-20px;left:50%;width:48px;height:26px;transform:translateX(-50%)}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:22px;height:20px;border:5px solid #f6d99a;border-radius:50%}
.bow::before{left:0;transform:rotate(-22deg)}.bow::after{right:0;transform:rotate(22deg)}
.bow i{position:absolute;left:50%;top:8px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#f6d99a;z-index:1}
.gift.open .lid{transform:translate(-6%,-95%) rotate(-26deg)}
.gift.open .base{box-shadow:0 0 60px 14px #f6e3c5cc,inset 0 0 0 1px #ffffff26}
.gift.boom{animation:boom .32s forwards}
@keyframes boom{to{transform:scale(1.45);opacity:0;filter:blur(8px)}}
.tile{display:none}
.gift.opened .base,.gift.opened .lid{display:none}
.gift.opened .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:absolute;inset:0;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(8px);font:600 clamp(16px,2vw,20px)/1.2 "Cormorant Garamond",Georgia,serif;color:var(--tx);padding:10px;text-align:center;text-wrap:balance}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#0a020cb3;backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;padding:36px 26px;max-width:440px;text-align:center;display:grid;gap:14px;justify-items:center;box-shadow:0 30px 80px #0007,inset 0 1px 0 #ffffff26;animation:pop .7s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{transform:scale(.4) rotate(-5deg);opacity:0}}
.big{font-size:68px;line-height:1;filter:drop-shadow(0 0 22px var(--gold));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.orn{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.pick .yes{font-size:16px;padding:14px 28px;animation:none}
.fields{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
input{font:700 16px Manrope,system-ui,sans-serif;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--tx)}
.ring{position:fixed;width:80px;height:80px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 30px var(--gold);pointer-events:none;z-index:35}
.env{position:relative;width:min(80vw,320px);aspect-ratio:3/2;cursor:pointer;perspective:800px;animation:float 6s ease-in-out infinite;transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .6s}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:8px;border-radius:12px}
.env.gone{animation:none;transform:translateY(50px) scale(.85);opacity:0;pointer-events:none}
.back,.pocket,.flap{position:absolute}
.back{inset:0;border-radius:10px;background:linear-gradient(160deg,#e8c9a0,#c9954a);box-shadow:0 24px 50px #0006}
.pocket{inset:0;border-radius:10px;background:linear-gradient(160deg,#f3dcb8,#d3a35a);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2}
.flap{left:0;right:0;top:0;height:55%;background:linear-gradient(180deg,#dcb06a,#c58f47);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .4s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:55%;z-index:4;font-size:36px;transform:translate(-50%,-50%);transition:transform .45s,opacity .35s;filter:drop-shadow(0 4px 8px #0006)}
.env.open .seal{transform:translate(-50%,-50%) scale(1.8);opacity:0}
.letter[hidden]{display:none}
.letter{width:min(92vw,440px);padding:36px 26px;border-radius:22px;text-align:center;display:grid;gap:18px;justify-items:center;background:linear-gradient(160deg,#fffaf0,#f4e3c4);color:#4a1a38;box-shadow:0 30px 70px #0007,inset 0 0 0 1px #c9954a55;animation:rise 1.1s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(90px) scale(.6) rotate(-4deg);filter:blur(6px)}}
.ln{font:500 clamp(20px,5vw,23px)/1.5 "Cormorant Garamond",Georgia,serif;animation:wordIn 1s calc(.9s + var(--i)*.8s) both cubic-bezier(.2,.7,.2,1)}
.ln.hd{font-size:clamp(28px,7vw,34px);font-style:italic;color:#a9772a}
.letter .btn{animation:in .8s both}
.teaser{color:var(--gold);font-style:italic;min-height:24px}
.sent{display:grid;gap:10px;justify-items:center;width:100%}
.sent[hidden]{display:none}
.sent textarea{width:min(100%,340px);resize:none;font:700 16px/1.5 Manrope,system-ui,sans-serif;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--tx)}
.cell.secret{grid-column:1/-1;justify-self:center;width:min(46%,190px)}
@media(min-width:700px){.cell.secret{width:min(24%,190px)}}
.cell.secret .base{box-shadow:0 0 44px 8px #e3c07b88,0 20px 30px #0006,inset 0 0 0 1px #e3c07b66}
@media (prefers-reduced-motion:reduce){.aurora i,.cell,.big,.yes,.yes::after,.env,.letter,.ln{animation:none}.screen,.card{animation:none}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="glow" id="glow"></div>
<canvas id="fx"></canvas>

<main>
<section class="screen" id="s0">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter"><div class="back"></div><div class="flap"></div><div class="pocket"></div><div class="seal">💌</div></div>
  <p id="tap">A letter for you. Tap to open.</p>
  <article class="letter" id="letter" hidden><div id="lt" style="display:contents"></div><button class="btn yes" id="cont" hidden>Continue 💖</button></article>
</section>

<section class="screen" id="s1" hidden>
  <span class="kicker" id="from"></span>
  <h1 id="q" style="--b:.3s;--st:.14s"></h1>
  <div class="row">
    <button class="btn yes" id="yes">Yes, I will 💖</button>
    <button class="btn no" id="no">No</button>
  </div>
  <div id="hint" aria-live="polite"></div>
</section>

<section class="screen" id="s2" hidden>
  <h2>I knew you’d say yes</h2>
  <p>Four gifts, four dates. Choose one box and see what’s waiting inside.</p>
  <div class="teaser">Open all four, there’s a secret waiting 🤫</div>
  <div class="gifts" id="gifts"></div>
</section>

<section class="screen" id="s3" hidden>
  <div class="card">
    <div class="big" id="fEmoji"></div>
    <h2>It’s a date</h2>
    <div class="orn"></div>
    <p id="fText"></p>
    <p>Choose a day and time, then send me your answer.</p>
    <div class="fields">
      <input type="date" id="fDate" aria-label="Date">
      <input type="time" id="fTime" aria-label="Time">
    </div>
    <button class="btn yes" id="send">Send my answer 💌</button>
    <div class="sent" id="sent" hidden><p>Send this message to Shubham on WhatsApp:</p><textarea id="msg" readonly rows="4" aria-label="Your message"></textarea><button class="btn ghost" id="copyBtn">Copy message</button><p id="copied" aria-live="polite"></p></div>
  </div>
</section>
</main>

<div class="overlay" id="ov" hidden>
  <div class="card" role="dialog" aria-live="polite">
    <div class="big" id="cEmoji"></div>
    <h2 id="cTitle"></h2>
    <div class="orn"></div>
    <p id="cText"></p>
    <div class="pick">
      <button class="btn yes" id="choose">This one 💖</button>
      <button class="btn ghost" id="another">Open another box</button>
    </div>
  </div>
</div>

<script>
const HER = "Akanksha", HIM = "Shubham";
const ideas = [
  {e:"🕯️", t:"Candlelight Dinner", m:"Just you, me, and a table glowing with candlelight. Dress up however makes you feel like a queen. I’ll bring the effort, the flowers, and every bit of my attention."},
  {e:"🌅", t:"Sunset & Chai", m:"We’ll chase the golden hour, share a cup of chai, and walk until the sky turns pink. No rush, no phones. Just us and all our little stories."},
  {e:"📸", t:"Dress-Up Photo Date", m:"You dress up, I become your photographer. We’ll wander somewhere pretty, click a hundred photos, and keep the best ones forever."},
  {e:"🍰", t:"Movie & Dessert Night", m:"A cosy movie of your choice, shared popcorn, and your favourite dessert after. Your head on my shoulder, your pick of everything."},
  {e:"🌟", t:"One Wish Coupon", secret:true, m:"A little extra, just for you. On our date, ask me for one wish, big or silly, and I’ll make it happen. No questions asked."}
];
const hues = [["#c2185b","#7a0f3d"],["#7b4bd6","#3d1f87"],["#d9a441","#a8641f"],["#1f9e8f","#0d5c66"],["#2a0b22","#12060f"]];
const hints = ["Oops, wrong button 🙈 Please click on Yes!","Nice try! Please click on Yes 💖","Still here? The Yes button is right there 🥺","Okay now I’m pleading… please click Yes 🥹","Pretty please, just click Yes! 🌹"];
const $ = s => document.querySelector(s);
const RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
const words = (el, t) => { el.innerHTML = t.split(" ").map((w, i) => '<span class="w" style="--i:' + i + '">' + w + "</span>").join(" "); };

$("#from").textContent = "A little question from " + HIM;
words($("#q"), HER + ", will you come on a date with me?");

/* Particle engine: ambient bokeh + petals, hearts, stars */
const cv = $("#fx"), cx = cv.getContext("2d");
let W, H; const dpr = Math.min(devicePixelRatio || 1, 2);
const size = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); };
addEventListener("resize", size); size();
const P = [], B = [];
const pal = ["#f6e3c5","#e3c07b","#e8b4a0","#d6336c","#ff8fab","#ffffff"];
if (!RM) for (let i = 0; i < 20; i++) B.push({x:Math.random()*W, y:Math.random()*H, r:20+Math.random()*50, v:.15+Math.random()*.3, a:.04+Math.random()*.08, o:Math.random()*500});
function spawn(x, y, n, o = {}) {
  if (RM) n = Math.ceil(n / 4);
  for (let i = 0; i < n; i++) {
    const a = o.a !== undefined ? o.a + (Math.random() - .5) * o.s : Math.random() * 6.283, s = (o.speed || 8) * (.3 + Math.random());
    P.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - (o.up || 0), g:o.g ?? .2, r:3+Math.random()*6, rot:Math.random()*6.28, vr:(Math.random()-.5)*.3, life:1, dec:.006+Math.random()*.01, c:pal[Math.random()*pal.length|0], k:["petal","heart","star","dot"][Math.random()*4|0]});
  }
}
function draw(p) {
  cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.max(p.life, 0); cx.fillStyle = p.c; const r = p.r; cx.beginPath();
  if (p.k === "petal") cx.ellipse(0, 0, r*1.4, r*.7, 0, 0, 6.283);
  else if (p.k === "heart") { cx.scale(r/8, r/8); cx.moveTo(0,3); cx.bezierCurveTo(-8,-3,-5,-9,0,-4); cx.bezierCurveTo(5,-9,8,-3,0,3); }
  else if (p.k === "star") for (let i = 0; i < 8; i++) { const rr = i % 2 ? r*.4 : r*1.5, a = i*Math.PI/4; cx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  else cx.arc(0, 0, r*.5, 0, 6.283);
  cx.fill(); cx.restore();
}
(function loop() {
  cx.clearRect(0, 0, W, H);
  for (const b of B) {
    b.y -= b.v; b.x += Math.sin((b.y + b.o) / 90) * .25;
    if (b.y < -60) { b.y = H + 60; b.x = Math.random() * W; }
    const g = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, "rgba(246,200,150," + b.a + ")"); g.addColorStop(1, "rgba(246,200,150,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 6.283); cx.fill();
  }
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.dec;
    if (p.life <= 0 || p.y > H + 40) P.splice(i, 1); else draw(p);
  }
  requestAnimationFrame(loop);
})();
function ring(x, y) {
  for (const dl of [0, 130]) {
    const e = document.createElement("div"); e.className = "ring"; e.style.left = x + "px"; e.style.top = y + "px"; document.body.appendChild(e);
    e.animate([{transform:"translate(-50%,-50%) scale(.2)", opacity:.9},{transform:"translate(-50%,-50%) scale(7)", opacity:0}], {duration:850, delay:dl, easing:"cubic-bezier(.1,.7,.2,1)", fill:"backwards"}).onfinish = () => e.remove();
  }
}
function show(id) {
  const cur = document.querySelector(".screen:not([hidden])"), nx = $("#" + id);
  if (!cur) { nx.hidden = false; return; }
  cur.classList.add("leave");
  setTimeout(() => { cur.hidden = true; cur.classList.remove("leave"); nx.hidden = false; scrollTo(0, 0); }, 450);
}
const glow = $("#glow");
addEventListener("pointermove", e => { if (e.pointerType === "mouse") { glow.style.opacity = 1; glow.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)"; } });

/* Screen 0: love letter */
const letter = [
  {t:"Dear " + HER + ",", c:"hd"},
  {t:"Some things are better said with a little effort, so I made this for you."},
  {t:"You bring so much energy and light into my days, and even ordinary moments feel special when you’re in them."},
  {t:"Thank you for every smile, every surprise, and for being exactly you."},
  {t:"You deserve my time, my attention and my effort, and I want to give you all three."},
  {t:"So here’s a question I’ve been waiting to ask you…"},
  {t:"Always yours, " + HIM + " 💖", c:"hd"}
];
const env = $("#env");
function openLetter() {
  if (env.classList.contains("open")) return;
  env.classList.add("open"); $("#tap").hidden = true;
  const r = env.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height * .55, 40, {speed:8, up:3, g:.12});
  setTimeout(() => env.classList.add("gone"), 800);
  setTimeout(() => {
    env.style.display = "none";
    $("#lt").innerHTML = letter.map((l, i) => '<div class="ln ' + (l.c || "") + '" style="--i:' + i + '">' + l.t + "</div>").join("");
    $("#letter").hidden = false;
    setTimeout(() => { $("#cont").hidden = false; }, letter.length * 800 + 1500);
  }, 1350);
}
env.addEventListener("click", openLetter);
env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLetter(); } });
$("#cont").onclick = () => show("s1");

/* Screen 1: runaway No */
const yes = $("#yes"), no = $("#no"), hint = $("#hint");
let tries = 0, moved = false;
function dodge() {
  const r = no.getBoundingClientRect(), yr = yes.getBoundingClientRect();
  spawn(r.left + r.width / 2, r.top + r.height / 2, 12, {speed:3, g:0});
  if (!moved) { no.style.position = "fixed"; no.style.left = r.left + "px"; no.style.top = r.top + "px"; no.style.zIndex = 5; document.body.appendChild(no); void no.offsetWidth; moved = true; }
  let x, y, k = 0;
  do { x = 14 + Math.random() * Math.max(10, innerWidth - r.width - 28); y = 14 + Math.random() * Math.max(10, innerHeight - r.height - 28); k++; }
  while (k < 14 && Math.hypot(x - yr.left, y - yr.top) < 170);
  no.style.left = x + "px"; no.style.top = y + "px"; no.style.rotate = (Math.random() * 24 - 12) + "deg";
}
no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(); });
no.addEventListener("touchstart", e => { if (Math.random() < .8) { e.preventDefault(); dodge(); } }, {passive:false});
no.addEventListener("click", () => {
  hint.textContent = hints[tries % hints.length];
  hint.animate([{opacity:0, transform:"translateY(8px)"},{opacity:1, transform:"none"}], {duration:400, easing:"ease-out"});
  tries++;
  yes.style.transform = "scale(" + Math.min(1 + tries * .1, 1.6) + ")";
  no.style.transform = "scale(" + Math.max(1 - tries * .08, .6) + ")";
  dodge();
});
yes.addEventListener("click", () => {
  const r = yes.getBoundingClientRect();
  ring(r.left + r.width / 2, r.top + r.height / 2);
  spawn(r.left + r.width / 2, r.top + r.height / 2, 80, {speed:12, up:4});
  setTimeout(() => { spawn(0, H, 60, {a:-1.0, s:.6, speed:20, g:.35}); spawn(W, H, 60, {a:-2.14, s:.6, speed:20, g:.35}); }, 200);
  no.style.pointerEvents = "none"; no.style.transition = "opacity .4s"; no.style.opacity = 0;
  setTimeout(() => { no.style.display = "none"; show("s2"); }, 1100);
});

/* Screen 2: gift boxes */
let cur = 0;
ideas.forEach((d, i) => {
  const c = document.createElement("div"); c.className = "cell";
  c.style.setProperty("--d", i * .14 + "s"); c.style.setProperty("--r", (i % 2 ? 6 : -6) + "deg");
  if (d.secret) { c.hidden = true; c.id = "secret"; c.classList.add("secret"); c.style.setProperty("--d", "0s"); }
  const b = document.createElement("button"); b.className = "gift";
  b.style.setProperty("--a", hues[i][0]); b.style.setProperty("--b", hues[i][1]);
  b.setAttribute("aria-label", "Gift box " + (i + 1));
  b.innerHTML = '<span class="base"></span><span class="lid"><span class="bow"><i></i></span></span><span class="tile"><span style="font-size:32px">' + d.e + "</span>" + d.t + "</span>";
  b.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || b.classList.contains("opened")) return;
    const r = b.getBoundingClientRect();
    b.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 26 + "deg");
    b.style.setProperty("--rx", -((e.clientY - r.top) / r.height - .5) * 26 + "deg");
  });
  b.addEventListener("pointerleave", () => { b.style.setProperty("--rx", "0deg"); b.style.setProperty("--ry", "0deg"); });
  b.onclick = () => {
    if (b.classList.contains("opened")) return card(i);
    if (b.classList.contains("open")) return;
    b.classList.add("open");
    setTimeout(() => {
      const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      ring(x, y); spawn(x, y, 90, {speed:13, up:5}); b.classList.add("boom");
      setTimeout(() => { b.classList.remove("open", "boom"); b.classList.add("opened"); card(i); }, 330);
    }, 540);
  };
  c.appendChild(b); $("#gifts").appendChild(c);
});
function card(i) {
  const sc = !!ideas[i].secret; cardSecret = sc; if (!sc) cur = i; $("#choose").hidden = sc; $("#another").textContent = sc ? "Keep it safe 💛" : "Open another box";
  $("#cEmoji").textContent = ideas[i].e; $("#cTitle").textContent = ideas[i].t;
  words($("#cText"), ideas[i].m); $("#ov").hidden = false;
}
let cardSecret = false, secretShown = false, secretOpened = false, waiting = false;
const allOpen = () => document.querySelectorAll("#gifts .cell:not(.secret) .gift.opened").length === ideas.length - 1;
function revealSecret() {
  if (secretShown) return; secretShown = true;
  $("#secret").hidden = false;
  $(".teaser").textContent = "A secret box just appeared 🌟";
  const r = $("#secret").getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, 50, {speed:9, up:3});
  $("#secret").scrollIntoView({behavior:"smooth", block:"center"});
}
function closeOv() {
  $("#ov").hidden = true;
  if (cardSecret) { secretOpened = true; if (waiting) finish(); }
  else if (allOpen()) setTimeout(revealSecret, 350);
}
$("#choose").onclick = () => {
  if (allOpen() && !secretOpened) { waiting = true; $("#ov").hidden = true; $(".teaser").textContent = "One last step: open your secret box 🌟"; setTimeout(revealSecret, 300); return; }
  finish();
};
$("#another").onclick = closeOv;
$("#ov").addEventListener("click", e => { if (e.target === $("#ov")) closeOv(); });
function finish() {
  $("#ov").hidden = true;
  $("#fEmoji").textContent = ideas[cur].e;
  $("#fText").textContent = "You picked “" + ideas[cur].t + "”. I can’t wait.";
  $("#fDate").min = new Date().toISOString().slice(0, 10);
  show("s3");
  setTimeout(() => { spawn(W / 2, H / 3, 80, {speed:12, up:4}); spawn(0, H, 50, {a:-1.0, s:.6, speed:20, g:.35}); spawn(W, H, 50, {a:-2.14, s:.6, speed:20, g:.35}); }, 500);
};

/* Screen 3: send the answer */
$("#send").onclick = () => {
  const d = $("#fDate").value, t = $("#fTime").value;
  let msg = "Yes " + HIM + "! 💖 I picked “" + ideas[cur].t + "”.";
  if (d) msg += " Let’s do it on " + new Date(d + "T00:00").toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"});
  if (t) msg += " at " + t;
  $("#msg").value = msg; $("#sent").hidden = false;
  const copy = () => { $("#msg").select(); try { navigator.clipboard.writeText(msg).catch(() => document.execCommand("copy")); } catch (e) { document.execCommand("copy"); } $("#copied").textContent = "Copied! Now paste it to " + HIM + " on WhatsApp 💌"; };
  $("#copyBtn").onclick = copy;
  if (navigator.share) navigator.share({text: msg}).catch(e => { if (e.name !== "AbortError") copy(); }); else copy();
};
</script>
</body>
</html>
